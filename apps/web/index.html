<!doctype html>
<html lang="zh-CN" data-mode="light" data-is-desktop="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="多应用后台管理模板 —— 基于 TanStack Router、Kumo 与 Tailwind CSS v4。"
    />
    <title>Nivo Admin</title>
    <script>
      /*
       * 桌面壳标记：壳（apps/desktop）在**导航之前**把标记写进 URL
       * （`?__desktop=1[&__desktop_<k>=<v>]`），这里在**任何应用代码之前**
       * 把它落地成 window.__DESKTOP__ 与 <html> 上的 is_desktop。
       *
       * 为什么走 URL：Wails 的注入点（WebviewWindowOptions.JS）三平台都在页面
       * 加载完成**之后**才执行，赶不上首屏；URL 是唯一「页面执行前就存在」的通道。
       *
       * 为什么要记一笔：壳只在**启动那一次**导航时能改写地址，而标记随后会被下面
       * 从地址栏抹掉（否则会被当成路由的 search 参数）—— 第 2 次加载（刷新、F5、
       * 壳自己 Reload）就没有标记了，窗口条与标签页会整个消失。
       * 于是把「这个窗口是桌面壳」连同标记记进 **sessionStorage**：只属于这一个窗口
       * 会话（刷新 / 站内跳转都在，窗口关掉就没了；浏览器标签页各有各的 sessionStorage，
       * 不会互相串），每次加载因此都能拿到标记。
       *
       * 浏览器里什么都不做 —— <html> 保持 data-is-desktop="false"。
       */
      ;(function () {
        try {
          var STORE_KEY = 'admin.desktop'

          var params = new URLSearchParams(window.location.search)
          var fromUrl = params.get('__desktop') === '1'

          var remembered = null
          try {
            var saved = window.sessionStorage.getItem(STORE_KEY)
            if (saved) remembered = JSON.parse(saved)
          } catch (error) {
            remembered = null // 存储被禁用 / 存档损坏：当作没记住
          }

          if (!fromUrl && !remembered) return

          var marks = {}
          var titleBarH = 40
          var platform = ''
          if (fromUrl) {
            var rawH = parseInt(params.get('__desktop_title_bar_h'), 10)
            if (!isNaN(rawH) && rawH > 0) titleBarH = rawH
            platform = params.get('__desktop_platform') || ''
            params.forEach(function (value, key) {
              if (key === '__desktop_title_bar_h' || key === '__desktop_platform') return
              if (key.indexOf('__desktop_') === 0) marks[key.slice('__desktop_'.length)] = value
            })
          } else {
            marks = (remembered && remembered.marks) || {}
            if (remembered && remembered.titleBarH) titleBarH = remembered.titleBarH
            if (remembered && remembered.platform) platform = remembered.platform
          }

          window.__DESKTOP__ = true
          window.__DESKTOP_PLATFORM__ = platform
          window.__DESKTOP_TITLE_BAR_H__ = titleBarH
          window.__DESKTOP_MARKS__ = marks
          var root = document.documentElement
          root.classList.add('is_desktop')
          root.dataset.isDesktop = 'true'
          if (platform) {
            root.dataset.desktopPlatform = platform
            if (platform === 'darwin') root.classList.add('is_mac')
            if (platform === 'windows') root.classList.add('is_windows')
          }
          root.style.setProperty('--shell-chrome-h', titleBarH + 'px')
          // 仅在 macOS 下设置 78px 红绿灯留白，其他系统为 0px
          root.style.setProperty(
            '--shell-traffic-light-w',
            platform === 'darwin' ? '78px' : '0px',
          )

          if (fromUrl) {
            try {
              window.sessionStorage.setItem(
                STORE_KEY,
                JSON.stringify({ marks: marks, titleBarH: titleBarH, platform: platform }),
              )
            } catch (error) {
              /* 存不下就退化成「只有带标记的这一次加载算桌面壳」 */
            }
          }

          // 地址里本来就没有标记时（走记忆的那条路）没什么可清理的
          if (!fromUrl) return

          // 标记是壳自己加的，不该留在地址栏里（否则会被当成路由的 search 参数）
          params.delete('__desktop')
          params.delete('__desktop_title_bar_h')
          params.delete('__desktop_platform')
          Object.keys(marks).forEach(function (key) {
            params.delete('__desktop_' + key)
          })
          var query = params.toString()
          window.history.replaceState(
            null,
            '',
            window.location.pathname + (query ? '?' + query : '') + window.location.hash,
          )
        } catch (error) {
          /* 忽略：标记不可用时按浏览器处理（默认 false） */
        }
      })()
    </script>
    <script>
      /*
       * 首屏主题脚本：在 React 挂载前就确定明暗模式，避免白屏闪烁。
       * 优先级：URL 参数 ?theme=dark|light|system > localStorage > 系统偏好。
       * 这段逻辑与 src/lib/use-color-mode.ts 保持一致。
       */
      ;(function () {
        try {
          var params = new URLSearchParams(window.location.search)
          var forced = params.get('theme')
          var stored = window.localStorage.getItem('admin.color-mode')
          var mode =
            forced === 'light' || forced === 'dark' || forced === 'system'
              ? forced
              : stored === 'light' || stored === 'dark' || stored === 'system'
                ? stored
                : 'system'
          if (forced) window.localStorage.setItem('admin.color-mode', forced)
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode
          document.documentElement.dataset.mode = resolved
          document.documentElement.style.colorScheme = resolved
        } catch (error) {
          /* 忽略：主题不可用时回退到默认浅色 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

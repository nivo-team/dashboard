<!doctype html>
<html lang="zh-CN" data-mode="light" data-is-desktop="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="多应用后台管理模板 —— 基于 TanStack Router、Kumo 与 Tailwind CSS v4。"
    />
    <title>Nivo Admin</title>
    <script>
      /*
       * 桌面壳标记：壳（apps/desktop）在**导航之前**把标记写进 URL
       * （`?__desktop=1[&__desktop_<k>=<v>]`），这里在**任何应用代码之前**
       * 把它落地成 window.__DESKTOP__ 与 <html> 上的 is_desktop。
       *
       * 为什么走 URL：Wails 的注入点（WebviewWindowOptions.JS）三平台都在页面
       * 加载完成**之后**才执行，赶不上首屏；URL 是唯一「页面执行前就存在」的通道。
       *
       * 浏览器里什么都不做 —— <html> 保持 data-is-desktop="false"。
       */
      ;(function () {
        try {
          var params = new URLSearchParams(window.location.search)
          if (params.get('__desktop') !== '1') return

          var marks = {}
          params.forEach(function (value, key) {
            if (key.indexOf('__desktop_') === 0) marks[key.slice('__desktop_'.length)] = value
          })

          window.__DESKTOP__ = true
          window.__DESKTOP_MARKS__ = marks
          var root = document.documentElement
          root.classList.add('is_desktop')
          root.dataset.isDesktop = 'true'

          // 标记是壳自己加的，不该留在地址栏里（否则会被当成路由的 search 参数）
          params.delete('__desktop')
          Object.keys(marks).forEach(function (key) {
            params.delete('__desktop_' + key)
          })
          var query = params.toString()
          window.history.replaceState(
            null,
            '',
            window.location.pathname + (query ? '?' + query : '') + window.location.hash,
          )
        } catch (error) {
          /* 忽略：标记不可用时按浏览器处理（默认 false） */
        }
      })()
    </script>
    <script>
      /*
       * 首屏主题脚本：在 React 挂载前就确定明暗模式，避免白屏闪烁。
       * 优先级：URL 参数 ?theme=dark|light|system > localStorage > 系统偏好。
       * 这段逻辑与 src/lib/use-color-mode.ts 保持一致。
       */
      ;(function () {
        try {
          var params = new URLSearchParams(window.location.search)
          var forced = params.get('theme')
          var stored = window.localStorage.getItem('admin.color-mode')
          var mode =
            forced === 'light' || forced === 'dark' || forced === 'system'
              ? forced
              : stored === 'light' || stored === 'dark' || stored === 'system'
                ? stored
                : 'system'
          if (forced) window.localStorage.setItem('admin.color-mode', forced)
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode
          document.documentElement.dataset.mode = resolved
          document.documentElement.style.colorScheme = resolved
        } catch (error) {
          /* 忽略：主题不可用时回退到默认浅色 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
